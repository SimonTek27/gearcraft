[workspace]
members = [
    "crates/gearcraft-core",
    "crates/gearcraft-daemon",
    "crates/gearcraft-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Simone Rizzo <simontek27@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/SimonTek27/gearcraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
gearcraft-core = { path = "crates/gearcraft-core" }
