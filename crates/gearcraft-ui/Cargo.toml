[package]
name = "gearcraft-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GearCraft desktop UI (Slint)"

[[bin]]
name = "gearcraft-ui"
path = "src/main.rs"

[dependencies]
gearcraft-core = { workspace = true }
# Pin <1.9 to avoid edition2024 deps on older toolchains; bump when Rust ≥ 1.85
slint = { version = "=1.6.0", default-features = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
once_cell = "1.19"
v4l = "0.14"
jpeg-decoder = "0.3"

[build-dependencies]
slint-build = "=1.6.0"
