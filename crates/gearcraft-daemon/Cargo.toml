[package]
name = "gearcraft-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Background daemon for GearCraft – USB HID + IPC (Unix socket / Windows named pipe)"

[[bin]]
name = "gearcraft-daemon"
path = "src/main.rs"

[features]
default = []
hidapi = ["dep:hidapi"]

[dependencies]
gearcraft-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
hidapi = { version = "2.6", optional = true, default-features = false, features = ["linux-static-hidraw"] }
libc = "0.2"
